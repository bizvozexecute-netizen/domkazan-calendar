name: domkazan-calendar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: domkazan_calendar
      POSTGRES_USER: domkazan
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domkazan -d domkazan_calendar"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: domkazan_calendar_test
      POSTGRES_USER: domkazan
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domkazan -d domkazan_calendar_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
