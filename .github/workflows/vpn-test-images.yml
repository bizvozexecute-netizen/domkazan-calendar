name: VPN test images

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Validate isolated Compose configuration
        run: |
          zero=$(printf '%064d' 0)
          node ops/vpn-test/setup.mjs \
            --app-image "ghcr.io/bizvozexecute-netizen/domkazan-calendar-app@sha256:$zero" \
            --tools-image "ghcr.io/bizvozexecute-netizen/domkazan-calendar-tools@sha256:$zero" \
            --tls-image "ghcr.io/bizvozexecute-netizen/domkazan-calendar-tls@sha256:$zero"
          node ops/vpn-test/verify-compose.mjs
          bash -n ops/vpn-test/check.sh ops/vpn-test/watchdog.sh

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: app
            dockerfile: Dockerfile
            target: runner
          - suffix: tools
            dockerfile: Dockerfile
            target: tools
          - suffix: tls
            dockerfile: ops/Dockerfile.tls
            target: ""
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.suffix }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.suffix }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record immutable reference
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.suffix }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
